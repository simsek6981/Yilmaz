name: Deploy website to GitHub Pages
on:
  workflow_dispatch:
    inputs:
      public_release:
        description: 'Website öffentlich freigeben (GitHub Pages bietet hier keinen privaten Zugriff)'
        type: boolean
        required: true
        default: false
      base_url:
        description: 'Endgültige HTTPS-Adresse mit optionalem Unterpfad'
        type: string
        required: true
        default: 'https://simsek6981.github.io/Yilmaz/'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ inputs.public_release }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build public release
        env:
          SITE_BASE_URL: ${{ inputs.base_url }}
        run: python build.py --public --base-url "$SITE_BASE_URL"
      - run: python verify.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
