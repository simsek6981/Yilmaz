name: Validate website
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/verify.py
      - run: python tools/components.py --check
      - run: python tests/release_test.py
      - run: python tools/email-preview.py
      - run: node --check assets/js/main.js
      - run: node --check assets/js/contact.js
      - run: node --test tests/contact.test.js
      - run: python tools/package.py
      - name: Ensure dist is not tracked
        run: test -z "$(git ls-files dist)"
